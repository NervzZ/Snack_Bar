name: Publish

# Started by the release workflow on a version tag: builds the zip, uploads it to CurseForge and GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Only version tags
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a version tag, not on a branch."
          exit 1
      - name: CurseForge token
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          # Without a token the packager skips CurseForge and still reports success.
          if [[ -z $CF_API_KEY ]]; then
            echo "::error::The secret CF_API_KEY is missing. Add it, then run this workflow again on the tag."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ github.token }}
